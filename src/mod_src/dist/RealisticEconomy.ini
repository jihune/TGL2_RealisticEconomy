; Realistic Economy for This Grand Life 2 v1.0322 - settings
; Lines starting with ';' are comments. Delete a line to get the built-in value back.
; The plugin writes what it did to RealisticEconomy.log next to this file.

[features]
; 1 = on, 0 = off. Each feature works without the others, and a feature that is off leaves that part of the game
; alone: switch off what you do not want. The trade lock (guard) is a matter of taste; guard=0 removes it.
; The texts the mod adds follow the game's language, all eight: English, Korean, German, Spanish, French,
; Brazilian Portuguese, Japanese, Simplified Chinese.
; credit   - loan rates follow the household's credit grade and the mortgage loan-to-value; the grade is shown
;            next to the interest rate in the game's loan windows and the tooltips of those loans. It is taken again after
;            every month end and whenever a loan or a home is added or removed. Variable loans follow it at once.
;            A fixed mortgage gets its rate once, when the home is bought, and keeps it whatever the grade does later.
;            A new education loan keeps the central-bank rate of the month you enrol.
;            Loans you already have keep their contract: variable ones follow the new rates, fixed ones are not touched.
; forecast - shows how much cash this month's end will need: one line at the top of the monthly summary panel
;            (the window that opens when the month changes). Loan payments are exact and follow a loan taken or
;            repaid during the month; wages, rent and the other month-end costs are taken from the last month end,
;            so they appear after one month has passed.
; wording  - puts right texts of the game that say something else than the English original. Korean: the words for
;            a fixed and a variable rate, the down payment in the mortgage window, the "could not afford" lines of
;            the monthly summary, the equity row and the research row of a company in the stock window, the lines
;            for a stolen and a recovered item. English: those two lines when the household has no home (the game
;            starts them with "??" or with a bare colon). Spanish: "Corregido" for a fixed rate. French: the line
;            for an industry that is busting.
; guard    - after you load a save from before a month end this playthrough has already passed, buying and selling
;            shares and opening futures trades are refused until that month end has been passed again. A save made
;            after that month end never locks anything; the game's end-of-month autosave locks for one hour and
;            lets its auto transfer buy, unless it was written while a lock was running. The lock and the hours
;            left are shown in the monthly summary panel. See [guard] below.
; ipo      - creating a public company pays you. You keep 45% of the shares; the public buys the rest at the price
;            the market puts on the business, and that money goes to your cash account as taxable income. The price
;            follows the game's own share-price rule: about 13 to 15 times a year's profit for a business that earns
;            8% or more of its value a year. See [ipo] below.
; board    - a household that holds a large part of a listed company gets seats on its board: one seat for every
;            20% held, for the members it nominates in the company's board tab while an election is open. A
;            nominee who would be elected anyway keeps that seat and uses up none of the guaranteed ones.
;            A company you list yourself starts with its election notice switched on. See [board] below.
; stocks   - the stock window says what a company's numbers mean: PBR, PER and dividend yield next to the amounts
;            of a company's first tab and in the hover text of the company list, a warning when the price is close
;            to or under 0.75 times the equity a share (where the game makes a company downsize, and bankrupt the
;            second time within six months), and for a company you have had researched the price the game's
;            monthly rule pulls toward and what its industries add to its earnings now. Shares you hold in a
;            company in that danger are named in one line of the monthly summary panel. In the futures tab the
;            asset's inflation rate is followed by what the game's own rule makes it average until the chosen
;            expiry. Nothing about the prices themselves is changed.
; casino   - the four casino games have a set stake each (slots $1,000, roulette $10,000, blackjack $100,000,
;            baccarat $1,000,000, times the game's price level) instead of an amount that grows with your net
;            worth, pay by chance alone (98%, 96%, 95%, 93% of the stakes come back), and can be played once a
;            month per household. The money moves when the 20 hours of the action are over, so an action given up
;            half-way has no result. See [casino] below.
; business - in a business you own: every candidate for a job shows, behind "Conduct Interview", what an hour's worth
;            of work costs with that person (the hourly wage divided by the work efficiency), and the list starts
;            with the cheapest. The hover text of a staff card's wage icon has the same number, and the hover text
;            of an offered contract's payout icon says how much more the offer pays than the standard cost of the
;            work it brings, and what that leaves per hour of work. Wages, candidates and contracts themselves
;            are not changed. And one line in the
;            monthly summary panel when a business loses work efficiency because assets are short, see [business].
; memory   - puts right a fault of the game that ends it after some dozens of loads without leaving the game. Every
;            load leaves about 13 MB of the game before it in memory, and the game, a 32-bit program, ends when
;            2 GB are used up. Two things stay behind: the game's data files (about 250 XML files, read again at
;            every load) and nine objects with the monthly records of the household, the businesses and the
;            listed companies. The mod deletes both with the game's own functions when a game ends; a load then
;            leaves about a third of a megabyte. Nothing of the game's rules or of a save is touched. See [memory] below.
; property - one line in the monthly summary panel when a property is for sale clearly under its value: "Property
;            under its value: 12 Mill Lane, 8.3% under its value, price $1,250,000". The game asks for a property
;            what its own formula makes it worth, moved by chance by about 4% either way, and its screen shows the
;            worth rounded down to two digits, so a cheap one is hard to see there. Buying costs about 3.1% in
;            fees. The list of properties is made anew every month. See [property] below.
; experience - the game takes 1% a month off every experience and education a job, an education or an activity is
;            measured against, so a degree counts for less every year and has to be studied again by somebody who
;            did not take up its trade in time. With this the members of your household keep the number of an
;            education they completed (a degree, a diploma, a certificate, a school year) at what they gained of
;            it, up to the highest amount that anything in the game asks of that education; what lies above that
;            amount still decays. Work experience decays as in the game. A save from before the mod is put right
;            at its first month end: the numbers of its educations go up to what was gained. Employees and people
;            outside the household are not touched. The "?" of the experience window says so too. 0 = the game's
;            own decay.
; fonts    - puts right the boxes with a cross in names and texts. The game draws with one font file for your
;            language, and a letter that file has no picture for is drawn as that box: Polish, Turkish or Japanese
;            letters in people's names while you play in Korean ("Napierała", "Uğurlu", "Kisaburō"), Korean lines
;            of a save while you play in English. With this such a letter is taken from another of the game's own
;            font files (fonts\NotoSansMono_SemiCondensed-Regular.ttf first), at the same size. Nothing of the
;            game's files is changed. Three names of the game's lists are in Arabic letters, which no font file of
;            the game has: such a name is written in Latin letters ("Arash", "Alishah", "Mohammad", the same names
;            as the same list has them), for a new person when the name is picked and for a person a save already
;            has when the save is loaded. 0 = as in the game.
; trace    - for testing only: logs every cash movement. Leave at 0.
credit=1
forecast=1
wording=1
guard=1
ipo=1
board=1
stocks=1
casino=1
business=1
memory=1
property=1
experience=1
fonts=1
trace=0

[stocks]
; The game's "Research Stock" takes five of your hours for one company, and what it shows is of the month it was
; done in. The mod can have the game do that research again whenever a new month starts.
; 1 = for a company with a member of your household on its board, for nothing.
researchOnBoard=1
; The subscription: other companies researched again every month for a fee a company (below). It is switched IN
; THE GAME, in the stock window's list of companies: a Shift-click on a company for that company, a
; Ctrl+Shift-click for every listed company (another one ends all of it). Switching on researches at once and
; takes the month's fee at once; a company that has this month's research already costs nothing until the next
; month, so off and on again within a month is paid once. When your cash does not cover what is due at once,
; nothing is switched. A line at the top of the screen says what was switched; a subscribed company has
; "subscribed" behind its name in the list and, once it has this month's research, no "Research Stock" button
; of the game's.
; At every month start the subscribed companies are researched again and a line in the monthly summary panel
; says how many and what it cost. That fee is charged whatever your cash is: what the cash does not cover becomes
; a debt of the game's, as with wages you could not pay (no interest, due after three months).
; This setting is only whether "every company" is on in a playthrough where you have never switched it in the
; game: 0 = off, 1 = on (researched from the next month start on).
researchSubscription=0
; The fee for one company and one month: this many hours of a bank analyst at the standard wage of the day (the
; game's own research takes 5 of your hours). It rises with the game's wages, and it is booked as a deductible
; expense. 0 = free.
researchFeeHours=5
; A fee once paid stays paid. The subscription is the playthrough's; the research and the cash are the save's. A
; save from before the fee, loaded again, has the cash back while what the research showed still holds, because
; share prices run the same course again. 1 = right after a load, and at a month start that comes a second time, a
; company whose fee of that month was paid before and that has no research of that month is researched again and
; its fee is taken again, whether it is still subscribed or not; cash that is short becomes a debt, as above. Not
; asked for again: months paid before a rollback beyond the trade lock's cap, which changes the course of prices.
; The mod remembers the last 24 months of a company. 0 = a loaded save gives the fee back.
researchFeeKept=1
; Above the company list of the stock window are five small buttons that sort it. Three of the game's orders say
; little about a share: by company type, by market capitalisation, by earnings a share. A fourth, by listing date,
; puts nothing in order.
; 1 = those four buttons sort another way:
;   - the second: every company, the largest market capitalisation (price x shares) first;
;   - the third: the companies you have had researched, the one furthest under its fair price first;
;   - the fourth: the same companies, the one furthest over its fair price first;
;   - the fifth: every company, the one whose price rose most against the month before first.
; A company a button does not rank (one you have not had researched; for the fifth one listed this month) comes
; under the others, in the order the game lists them. The hover texts of the buttons say the new order. A second
; click on a lit button goes back to the game's first order, as it always did. 0 = the game's four orders.
sortButtons=1
; The chart of a company (the last tab of a company in the stock window) draws four lines on one scale: the share
; price, and the equity, the dividend and the earnings a share. The last two are so small next to the price that
; they lie flat on the bottom, and the price itself is squeezed into the top of the picture.
; 1 = the chart opens with the share price alone. The other three are a click on their boxes away, and the box
; for all of them ticks the four. 0 = the game's own: all four at once.
chartPriceOnly=1
; The three small buttons of the economy (economic growth, the central bank's rate, inflation; a click on the
; numbers left of the cash account shows them) all open one chart with seventeen lines.
; 1 = that chart opens with the line of the button you clicked alone; the rest are a click on their boxes away.
; 0 = the game's own: all seventeen.
chartEconomyOne=1
; Three smaller things for every chart of the game:
;   - the lines get colours you can tell apart (the game picks dark greens and browns by chance each time);
;   - a chart with more than eighteen lines has its boxes on pages, and the game ticks every box again when you
;     turn the page. With this what you unticked stays unticked, and the box for all is for the lines of every
;     page;
;   - the time button at the top right goes 6 months, 1 year, 2 years, 5 years, the most (the game: 2 years,
;     5 years, the most).
; 1 = all three. 0 = the game's own.
chartFixes=1
; The chart of all share prices (the chart button above the company list) draws a share of $16 and one of $700
; on one scale, so the cheap ones lie flat and nothing can be compared.
; 1 = every share is shown against its price in the first month of the picture, as 100: 130 is a third up, 80 a
; fifth down, whatever the price. The title says "(first month shown = 100)". The numbers at the side and under
; the mouse are that index, not dollars. Change the time with the button and the first month moves with it.
; 0 = the game's own: prices.
chartIndex=1
; What four more charts show when they open. The rest is a click on the boxes (or on the box for all) away.
;   - the household's wealth (the last tab of the finance window): net worth, cash and debt. The game draws nine
;     lines on one scale;
;   - the stock index (the fourth small button of the economy): its growth over a year. The growth of the month
;     jumps about and hides it;
;   - all share prices: the companies you hold shares of. Without any, or when none of them has its box on the
;     first page of boxes, all of them as before;
;   - growth, the central bank's rate and inflation: the last five years, where the game shows twenty.
; 1 = as above. 0 = the game's own.
chartOpenWith=1
; The lines of every chart. The game draws them one pixel wide with soft edges, so a line is paler than the
; colour of its name. This is half the width of a line in the chart's own units: 2 gives a line about four wide,
; as thick as the chart's axes. 0 = the game's own thin line.
chartLineWidth=2
; 1 = in every chart the name of a line (next to its box) is followed by the line's value in the last month, as
; the chart writes numbers: "Net Worth 49,099,095", "Share Price 283.25". In the chart of all share prices this is
; the price itself, also when the picture is the index. 0 = the names alone.
chartValues=1
; 1 = in the stock window's list a company's name is followed by how its share price changed against the month
; before, "(+5.7%)". A company you have had researched also has how far its fair price is above today's price,
; "(+5.7%, fair +34%)", and its name is blue; a subscribed company has "subscribed" at the end, one you sit on
; the board of "board". The name of the company itself is not changed. 0 = the game's rows.
rowNumbers=1
; The futures tab of the same window lists the assets by name alone, and the second of its two sort buttons
; orders them by what a unit costs.
; 1 = an asset's name is followed by its inflation rate - the number the right-hand side shows for the asset you
; click - and, behind an arrow, what the game's rule makes that rate average over the next 12 months:
; "(+4.3% -> +5.1%)". The second sort button sorts by the second number less the first, the largest first: at
; the top what is expected to rise most (a purchase is ahead), at the bottom what is expected to fall most (a
; sale). The hover text of a row has the rate and the expectation until 6, 12 and 24 months. 0 = the game's list.
futuresList=1

[business]
; 1 = when the month changes or a save is loaded and a business of yours works below 100% because furnishings or
; the assets of a job are short, the summary panel names it: "Work efficiency down: S-Air (assets 80%)".
efficiencyAlert=1
; The game's automatic staff management (the round-arrow icon at the top of a business's staff tab) is switched on
; person by person, so somebody you hire later is outside it until you click again.
; 1 = a person you hire gets it at once when at least one employee of that business has it. You can click it off
; in the staff tab like any other.
autoManageNewStaff=1
; 1 = a click on anybody's automatic-management icon in the staff tab switches it for every employee of that
; business (what the game does on a Shift-click), so the icon is the switch of the business. What the mod does
; about staff applies to employees who have it. 0 = person by person, as in the game.
autoManageWholeBusiness=1
; A save from before the mod. Two switches of the game do more with the mod: "buy worn-out assets again" now pays
; for what it buys and buys missing assets too (on debt if the cash does not cover them), and the automatic staff
; management hires, lets people go and answers wage demands by the mod's rules. You switched them on for what the
; game does with them.
; 1 = the first time a playthrough is loaded with the mod, both are switched off in every business, and a line in
; the monthly summary says so. Switch on again what you want the mod to do. A save you write after that keeps its
; switches; an older save of the same playthrough, from before that first load, is switched off again when it is
; loaded. With the casino feature on, a casino game in the action queue of such a save is taken out of the queue
; too, the way a right click takes it out: the game's own casino has no stake and gives its result when a game
; begins. One that had begun keeps the result the game gave and counts as played this month. Nothing else of the
; save is changed. 0 = the switches and the queue stay as the save has them.
switchesOffOnFirstLoad=1
; Staff filled in. People work their month's hours off early in the month, so a job that is short of people stands
; still from about a quarter of the month on. Seven times a month (every 91 game hours) the mod looks at every job
; that has an employee under the automatic management and is not outsourced:
; 1 = when the work still to do this month is more than the hours its people have left, a candidate of the job is
; hired - the one with whom an hour of the missing work costs least (the monthly wage over the hours of the missing
; work that person gets done; 12 hours missing pick the lowest wage, 300 the best rate) - and then the next one,
; until the work has hands or the month's candidates are used up. Each hiring costs hireFeeHours; there is no limit
; to how many. An hour of a person counts for what the business's assets leave of it, and where a job is short of
; hands and of assets the assets are bought first (missingAssetsBought below). Nobody is hired for a job that has
; none at all of one of its assets: the game does not work such a job. A person hired like this who is one too
; many in the next month is let go at that month end without the wait of spareMonths. 0 = nobody is hired by the mod.
autoHire=1
; "more": by at least 8 hours and by more than this share of the job's work of the whole month, 0.05 = 5%.
autoHireShort=0.05
; Hiring ahead. A contract signed in a month brings its work from the next month on. When that work, with the
; job's work of this month, is more than the job's people do in a month AND more than a month's candidates could
; add on top (this month's list stands for next month's), the mod hires at once for what would be without hands,
; from this month's candidates: two months' candidates for work one month's cannot staff. Somebody hired like
; this is paid for a month with little to do. 1 = on. 0 = nobody is hired before the work is there.
autoHireAhead=1
; A business you close (the button "Open" of its window; a move to other premises takes a closed business) is
; left alone by all of the mod's rules until you open it again: nobody is hired, let go or replaced, a wage demand
; is met as the game's own management meets it, no asset is bought, no contract signed, and the paid adverts the
; mod has are switched off. A line at the top of the screen says so when you close and when you open. There is no
; setting for this. (The game takes reputation at the month end from a business closed with work left undone.)
; A staff that fits the work, for employees under the automatic management. Just before every month end the mod
; looks at the hours each person did not work that month. When the same holds for this many month ends in a row:
;   - in a job of two or more people, somebody whose work the others could have done in the hours they left
;     unworked is let go: the one whose hour of work costs most. The month is paid, there is no severance.
;   - somebody alone in a job who left the share below of the hours unworked is replaced, when the job's
;     candidates have a person of fewer hours and a lower wage who gets a quarter more done than was done that
;     month. The hiring costs hireFeeHours, letting the present person go costs nothing. A job's candidates are
;     looked at once in this many month ends, and those of two jobs a month end at most.
; A business that signed a contract in the month lets nobody go and replaces nobody at that month end: the game
; gives a contract's work from the next month start on, and that month is measured first.
; Nothing of this is written into the monthly summary panel; the mod's log file has it. 0 = off.
spareMonths=3
; "alone in a job and idle": this share of the month's hours not worked, 0.5 = half or more.
idleShare=0.5
; The game's automatic management says yes to every pay rise an employee under it asks for (about 24% each time).
; 1 = the mod answers instead, at the end of the month the rise was asked in, just before the game would let that
; person go for want of an answer. It looks at the job's candidates of that moment (the list of the hire window)
; and at the work the job wants from that place: what the person did that month and what the job left undone.
;   - when one of them gets that work done (at least 90% of it) and an hour of it costs less with that candidate,
;     by more than the margin below, the employee leaves, which costs nothing, and that candidate is hired in the
;     place, with the automatic management on. An hour of it costs: the monthly wage over the hours of the wanted
;     work a person gets done; hours nobody needs make no one cheaper;
;   - otherwise the rise is given. The wage rises from the same month as with the game's own yes.
; Nothing of this is written into the monthly summary panel; the mod's log file has every answer.
; 0 = the game's own behaviour. Employees without the automatic management are not touched: their pay rises still
; come to you in a window.
wageDemandRule=1
; How much cheaper the candidate has to be: 0.03 = more than 3% less for an hour's worth of work.
wageRefuseMargin=0.03
; 1 = an employee the job did not need that month gets no rise and nobody is hired for the place: when the other
; employees of the same job in that business left unworked at least as much work (hours x work efficiency) as
; this one did. A way to shrink a staff that has become too large without paying severance. 0 = such a person is
; treated like any other.
wageNoRiseWhenSpare=1
; What such a hiring costs the business: this many hours of a store manager at the standard wage of the day (by
; hand, hiring is an interview of 20 of your own hours). Booked as staff costs of the business, so it lowers the
; taxable profit like wages do. 0 = free. The game's own replacement of a person who resigns for personal reasons
; keeps its own price (two monthly wages).
hireFeeHours=20
; The game draws the candidates of a job the first time you open its hire window in a month, by chance as it
; stands at that moment. So loading a save and doing something else first (letting an hour pass, opening another
; window) gives other people or other wages, and loading until a good cheap person turns up costs only time.
; 1 = the candidates of a job in a month are always the same, whatever save you load and whatever you do before
; you look. They still change every month, and they differ from job to job and from business to business.
; 0 = the game's own behaviour.
candidatesFixed=1
; A fault of the game: with a business's switch "buy worn-out assets again" on, the game puts a new unit in the
; place of an asset that has worn out - and pays you its price instead of charging it.
; 1 = the price is charged, as when you buy the asset by hand. 0 = the game's own behaviour (you are paid).
assetReplacementCharged=1
; A business wants so much of every kind of asset (desks, parking spaces, an excavator), by its jobs, staff and
; expected work; with less its work efficiency drops. The game buys again only what has worn out.
; 1 = for a business with the game's "buy worn-out assets again" on, the mod buys what is missing right after a
; month has changed, and during the month when a job is short of hands while its assets are short, at the game's
; shop price. Where several wares bring the asset: a kind the business has already; else a kind your other
; businesses have; else, among the wares your cash covers, the one with the lowest cost of an hour for one missing
; unit (the price over the ware's life plus what it uses up, at the day's prices); else the lowest price. Nothing
; is bought that does not fit into the floor space. The monthly summary and a line across the top of the screen name what was bought
; and what could not be. At most 12 units a business at one time. The game's empty notice after it has bought a
; worn-out asset again gets a text too. 0 = the game's own behaviour.
missingAssetsBought=1
; What happens when the cash does not cover a missing asset.
; 1 = it is bought all the same. The game books what the cash does not cover as a debt of its own: no interest,
; to be paid in one sum at the third month end. The summary and the line on top say how much became debt.
; Mind what a business wants: a debt that is not paid when it falls due becomes a debt of 120% that can end in
; bankruptcy, and an aircraft or an excavator costs far more than a desk. Sell what you did not want (a right
; click on the asset's icon), or switch the business's "buy worn-out assets again" off before the month changes.
; 0 = a unit is bought only out of the cash that is left once what the month end is expected to take is set
; aside (the forecast line); the summary names what could not be bought as "not enough cash".
missingAssetsOnDebt=1
; Adverts (the icons next to the megaphone in a business window) bring awareness, which is how much work arrives,
; and cost money while they are switched on.
; 1 = the adverts of a business can be handed to the mod: a Shift-click on one of its advert icons hands them
; over, another takes them back (a line at the top of the screen says which; the hover text of an advert icon
; says who has them). Nothing is handed over until you do that. For a business handed over the mod sets every
; paid advert each time the game works out the adverts, every 91 hours: on while the awareness is below the level
; below, off once it is there. The icons of those adverts are orange while the mod has them, and a plain click
; on one switches nothing. An advert that costs no money is left alone. 0 = no such switch; the two settings
; below do nothing.
advertsKeep=1
; The level: 1.03 = the adverts are on while the awareness is below 103%. When a month changes the game takes 3%
; of the awareness and then 30% of what is still above 100%, so up to 103% nearly all of it goes into the next
; month and a third of what is above is gone at once. Between 0.05 and 1.3.
advertsUpTo=1.03
; What that costs: for an advert that was on all month this many hours of a PR specialist at the standard wage
; of the day (about $262 for 5 hours in a save of 2035), less for one that was on less. Taken just before the
; month end, booked as staff costs of the business. It is taken whatever your cash is; what the cash does not
; cover becomes a debt of the game's (no interest, due after three months). 0 = free.
advertsFeeHours=5
; Contracts. A business is offered contracts when a month starts, and accepting one takes 10 of your hours. A
; contract the business cannot carry fails, and giving one up costs reputation.
; 1 = the signing can be handed to the mod: a Shift-click on the icon "Contracts" of a business window hands it
; over, another takes it back (a line at the top of the screen says which; the window of the offers opens as it
; always does). Nothing is handed over until you do that. For a business handed over the mod signs, right after a
; month has started, every one of that month's offers the business has a place for - a contract's work starts
; with the month after, and the staff rules above hire for it - when all of this holds:
;   - the business is open and has a place for another contract;
;   - its staff is under the game's automatic management and its "buy worn-out assets again" is on, so that the
;     mod hires and buys for the new work (autoHire and missingAssetsBought above);
;   - the month before left no more of its work undone than autoHireShort lets pass (5% and 8 hours): more than
;     that means the hirings did not keep up, and more work would only add to it;
;   - the offer pays more than its work costs at standard wages and prices (the number in the hover text of the
;     offer's payout icon);
;   - the floor space holds it, with the offers signed before it in the same month: what is in use now, larger by
;     as much as the work grows, fits the premises.
; The offers that pass are signed from the one that pays most over its cost down, the longer one first where two
; pay alike. The monthly summary and a line at the top of the screen name them. The mod never gives a contract up.
; (A contract fails when the shares of its work left undone, month by month, add up past a tenth of its months:
; a long contract bears some bad months, a 6-month one hardly one.) The mod's log file says for every offer why it
; was or was not signed. 0 = no such switch; the settings below about contracts and a whole business do nothing.
contractsKeep=1
; What a signing costs the business: this many hours of a store manager at the standard wage of the day (about
; $322 for 10 hours in a save of 2035). Booked as staff costs of the business. 0 = free.
contractFeeHours=10
; All of a business at once: a Ctrl+Shift-click on one of its advert icons hands over staff, assets, adverts,
; contracts and floor space together. Every employee is put under the game's automatic management, "buy worn-out
; assets again" is switched on, and the adverts and the signing are handed over as by their own Shift-clicks.
; Another Ctrl+Shift-click takes all of it back and switches those two off. Handing over costs nothing by itself;
; each part costs what it costs alone. It needs advertsKeep=1 and contractsKeep=1.
; 1 = a business handed over whole is locked: the clicks that would change it are not passed on, and a line at the
; top of the screen says why. Locked are the hire window of a job, the staff tab (where people are let go), the
; asset shop, selling an asset or an inventory item (the right click), a job's outsourcing box, the star, the box
; "buy worn-out assets again", the month's offers and giving a contract up; a Shift-click on an advert icon takes
; nothing back by itself either. Still yours: everything that only shows something, the button "Open" and the
; premises (a move), buying inventory, the influence operation, and the priority your household's members have for
; working a job (that is set in their own windows too; the mod staffs the job as if nobody of them worked there).
; To do any of the locked things, take the business back first. 0 = nothing is locked; what you change by hand in
; a business handed over the mod's rules may put back (somebody let go is hired again, an asset sold bought again).
lockHandedOver=1
; Floor space is the fifth part, and only a business handed over whole has it. The star next to the floor space
; in a business window is the game's own switch: it doubles the premises at the month end.
; 1 = when a missing asset does not fit, or an offered contract needs more room than there is (up to twice the
; premises), the mod switches that star on for RENTED premises. The rent rises by what the game charges for it,
; and the summary says by how much. Premises you OWN are left alone, because making them larger costs a purchase
; price at once: the summary says how much it would be, and the star is yours to click. Premises that are the
; largest of their kind cannot grow: the summary says that the business has to move. 0 = the mod never touches
; the star.
premisesGrow=1

[property]
; The summary panel gets one line for the property for sale that would gain you most, when the gain is large
; enough. The mod looks when the month changes (the game puts new properties on the market then), after a save is
; loaded, and when a search of your character has ended; the line is rewritten each time. It costs nothing.
; The gain is the property's value less what buying it costs: the price, the game's fee of 3% of the price and
; 0.1% of the value. A property is named only when that gain is BOTH of these:
; the share - 0.05 = at least 5% of the value. That takes a price about 8% under the value; one property in forty
; is that cheap. 0 = this test is off.
alertBelowValue=0.05
; the amount - in dollars of the game's first prices; it rises with the game's price level. 54000 is about
; $100,000 in 2035 of a game started in 2025. It keeps small deals out. 0 = this test is off.
; With both at 0 every property would be named, so the mod then takes 0.05 for the share.
alertBelowAmount=54000

[memory]
; 1 = the nine objects the game leaves of an ended game are deleted too. 0 = only the data files are; a load then
; leaves about 5.5 MB instead of a third of one. For the case that loading ends the game with this at 1.
deleteLeftObjects=1

[casino]
; 1 = a game you have played stays played: after loading an older save, what the games after that save won or lost
; is put into your cash at once and those months' games cannot be played again. 0 = loading an older save forgets
; the games after it, so a lost game can be undone by loading.
keepResultsOnLoad=1

[board]
; The part of a company that guarantees one of the five seats. 0.20 = one seat from 20%, two from 40%.
; The game asks for 5% to nominate anyone, so a smaller value counts as 0.05.
holdingPerSeat=0.20
; 1 = a company you list tells you when a board election opens (the game's own switch in the board tab, which
; the game leaves off). The first election opens the month after the listing and can be entered during that
; month only; the next one comes 24 months later. The switch is set where the mod makes the listing, so it needs
; ipo=1 above; with ipo=0 tick the box in the board tab yourself.
electionNotice=1

[ipo]
; The part of the new company you keep, 0.05 to 0.45. 0.45 is the most the game lets anyone hold of a company.
; (The game itself: you keep 0.25, the rest is new shares whose price goes into the company, and you get no cash.)
founderKeeps=0.45
; 1 = while the business makes any profit, the shares are never sold below what the business would sell for.
; A business that loses money is priced by the market alone.
floorAtSaleValue=1
; 1 = the cash of the listing counts as taxable income, the way the game treats the price of a sold business.
cashTaxable=1
; The "company quality" letter of the window in which you pick the businesses. It tells how many times the price
; the businesses would sell for the public pays per share: AAA above the first number, then AA, A, B, C, D.
; E is a business that is priced at the floor or loses money. A business that earns this much of its value a year
; lands at about: 5% -> 1.0, 7.5% -> 1.2, 10% -> 1.5, 14% -> 2.0, 18% -> 2.5, 23% -> 3.0.
; (The game's own letter compares the price with the company's equity per share in steps of 5%; with no new money
; in the company every business above 7% would read AAA.)
gradeAbove=3.0,2.5,2.0,1.5,1.2,1.0

[guard]
; The longest a lock can last, in months, counted from the moment of the load. 0 = no limit: the lock always runs up
; to the farthest month end you have seen.
maxLockMonths=2
; What happens when you go back further than that limit. 1 = share prices take another course from the load on, so
; what you saw beyond the limit does not come again. Loading the same save again gives that same new course, not yet
; another one. 0 = prices repeat exactly, and what you saw beyond the limit can be used once the lock is over.
shiftMarketBeyondCap=1
; The game draws a month's growth, the ups and downs of the industries (they settle futures) and the new share
; prices at the month end, and the price of a listing when its window opens, from random numbers that other things
; use up on the way: a search for a property, the "create a public company" window, an activity with a random
; payment. So loading a save and doing one of them first gives another result for the same month, and with shares
; or futures in hand a poor month can be loaded away until a good one comes. The lock above does not stop that,
; because nothing is traded. The list of properties for sale that a new month brings is drawn the same way, so it
; could be loaded away until a property far under its value is in it.
; 1 = a month's growth, cycles and share prices do not depend on how many random numbers were used up before the
; month ends: they are the same whatever save you load and whatever you do first. The listing price of a business
; is the same every time its window opens in a month, and the listing gets the price the window showed. The same
; for what the property market draws when a month starts: the properties for sale of the new month, and the offer
; of that month for a property you have put up for sale or for rent. When you go back further than maxLockMonths,
; all of them take another course together with the share prices.
; 0 = the game's own behaviour.
monthEndFixed=1
; Set to 1 to forget everything this playthrough has seen: the next load has no lock and no changed prices, and this
; value goes back to 0 by itself. For the case where you went ahead by mistake.
release=0

[credit]
; Four ratios give 0 to 3 points each; the sum (0-12) sets the grade:
;   AAA 11-12, AA 9-10, A 7-8, BBB 5-6, BB 3-4, B 0-2
; The three numbers are the limits for 3, 2 and 1 point.
; debt other than mortgages / assets other than homes: at most. (A mortgage counts through its payments and its
; loan-to-value below, not here.)
debtToAssets=0.20,0.40,0.60
; yearly debt payments / yearly income: at most
serviceToIncome=0.20,0.35,0.50
; liquid assets (cash, savings, investments, shares) / yearly expenses, in years: at least
liquidYears=1,0.5,0.25
; net worth in dollars: at least. $50,000 is where the game starts raising prices for the rich,
; $1,000,000 is where the Influence window unlocks, $6,000,000 is where the second tier of rivals begins.
netWorth=6000000,1000000,50000
; 1 = multiply the net worth limits by the game's inflation index, as the game does with its own thresholds
indexNetWorth=1

; Rate = central-bank rate + spread. One number per grade: AAA, AA, A, BBB, BB, B.
personalSpread=0.03,0.04,0.05,0.07,0.10,0.14
mortgageSpread=0.012,0.015,0.018,0.022,0.030,0.040
; Extra mortgage spread by loan-to-value of all the household's homes: limits, then the five spreads.
ltvBounds=0.40,0.60,0.75,0.85
ltvSpread=0,0.0025,0.0060,0.0120,0.0200
; A fixed mortgage rate = the variable rate + fixedPremium + fixedReversion x (neutral rate - central-bank rate).
; The neutral rate is the game's own baseInterestRate (0.075 unless a mod changes it): the level the central-bank rate
; keeps returning to. So fixing is dear while rates are low and cheap, even cheaper than variable, while they are high.
; fixedReversion=0 gives a flat premium. (The game itself: variable x 1.1 + 0.03.)
fixedPremium=0.005
fixedReversion=0.5

; Which entries of the game's income / expenses record count. Numbers are the finance tags listed in data/idmap.txt.
; capitalTags      - moving wealth around, neither income nor expense (trades, property, savings, capital assets ...)
; businessCostTags - subtracted from income, so that business profit counts and not revenue
; notIncomeTags    - receipts that are not income (gambling)
capitalTags=2061,2081,2111,2501,2506,2524
businessCostTags=2526,2511,2065,2531,2541
notIncomeTags=2191

[trace]
; timing=1 is read whatever trace is set to: when a month has started and after a load the log gets a line a kind of
; the plugin's work with how often it ran, how long in all and its longest single time, and the same for the game's
; own month end, month start and load. For seeing whether the mod slows the game down.
timing=0
; The rest is only read when trace=1.
money=1
getter=1
cashflow=1
; heap=1 logs, after every load, how many memory blocks of each size the game holds (thousands of lines a load);
; heapSample=32,56 adds what some blocks of those sizes contain. For finding what a load leaves behind.
heap=0
; advance the random stream behind stock prices by this many draws after a load (a test of the load guard design);
; economyShift does the same to the stream behind growth and the industries' cycles. Both from the load with the
; number marketShiftFromLoad on, counted from the start of the game's program.
marketShift=0
economyShift=0
marketShiftFromLoad=1
; 1 = a pay rise an automatically managed employee asks for is refused whenever a candidate can take the place,
; cheaper or not (a test of the refusal and of the hiring). With trace=1 the log also lists every employee just
; before a month end, with the hours of the month that were not worked.
refuseWageDemands=0
